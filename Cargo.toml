[package]
name = "pyudb"
version = "0.1.0"
edition = "2021"
description = "A distributed database with Raft consensus, ACID transactions, and PyuSQL query language"
authors = ["PyuDB Team"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# gRPC
tonic = "0.12"
prost = "0.13"

# Networking
bytes = "1.0"

# Utilities
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
crossbeam = "0.8"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.4"

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "pyudb"
path = "src/main.rs"

[[bin]]
name = "pyudb-cli"
path = "src/bin/cli.rs"

[lib]
name = "pyudb"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.24"
